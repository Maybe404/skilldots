<!doctype html>
<html lang="zh-CN" data-style="clean">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>skilldots</title>
    <script>
      // Apply the remembered interface style before the first paint.
      try {
        var s = localStorage.getItem("skilldots.desktop.style")
        if (s === "doodle" || s === "clean") document.documentElement.dataset.style = s
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
